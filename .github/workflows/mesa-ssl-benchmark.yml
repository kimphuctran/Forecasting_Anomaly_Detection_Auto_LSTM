name: MESA-SSL actual official-model smoke evaluation
on:
  push:
    branches: [mesa-ssl-official-benchmark-2026]
    paths: ['.github/workflows/mesa-ssl-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset: [GunPoint, ItalyPowerDemand, BasicMotions]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'aeon==1.6.0' 'scikit-learn>=1.5,<1.10' 'huggingface_hub' 'transformers>=4.54.1,<5' 'tqdm'
          python -m pip install 'git+https://github.com/moment-timeseries-foundation-model/moment.git'
      - name: Clone authors' original source code
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/zhihanyue/ts2vec.git third_party/ts2vec
          git clone --depth 1 https://github.com/ustc-time-series/TimeMAE.git third_party/TimeMAE
          mkdir -p "results/${{ matrix.dataset }}"
          git -C third_party/ts2vec rev-parse HEAD > "results/${{ matrix.dataset }}/ts2vec.commit.txt"
          git -C third_party/TimeMAE rev-parse HEAD > "results/${{ matrix.dataset }}/timemae.commit.txt"
      - name: Decode and verify reproducible runner
        run: |
          base64 -d mesa_ssl_benchmark/bench_neuro_ssl.py.gz.b64 | gzip -dc > bench_neuro_ssl.py
          echo 'd5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  bench_neuro_ssl.py' | sha256sum -c -
          python -m py_compile bench_neuro_ssl.py
      - name: Evaluate on official dataset split
        run: |
          python bench_neuro_ssl.py --dataset "${{ matrix.dataset }}" --seed 100 --epochs 5 \
            --methods Raw MESA-TS TS2Vec TimeMAE MOMENT-1-small --out "results/${{ matrix.dataset }}"
      - name: Record dependencies and archive outcomes
        if: always()
        run: |
          mkdir -p "results/${{ matrix.dataset }}"
          python -m pip freeze > "results/${{ matrix.dataset }}/requirements-lock.txt"
          cp bench_neuro_ssl.py "results/${{ matrix.dataset }}/bench_neuro_ssl.py" || true
      - name: Upload per-dataset provenance and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-official-benchmark-${{ matrix.dataset }}
          path: results/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 30
