name: MESA official time-series assets check
on:
  push:
    branches: [mesa-ssl-official-benchmark-2026]
    paths: ['.github/workflows/mesa-data-acquisition.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset reader and metrics
        run: |
          python -m pip install 'aeon>=1.5,<1.7' 'numpy>=1.26,<3' 'scikit-learn>=1.5' 'scipy>=1.12'
      - name: Export UCR UEA train/test splits and evaluate real five-label baseline
        run: |
          mkdir -p artifacts/data
          python - <<'PY'
          import json, hashlib, numpy as np
          from pathlib import Path
          from aeon import datasets
          from sklearn.linear_model import LogisticRegression
          from sklearn.preprocessing import StandardScaler
          from sklearn.metrics import f1_score
          sources={'GunPoint':'load_gunpoint','ItalyPowerDemand':'load_italy_power_demand','BasicMotions':'load_basic_motions'}
          folder=Path('artifacts/data'); rows=[]
          for name, fn in sources.items():
              record={'dataset':name}
              try:
                  load=getattr(datasets,fn)
                  train,yt=load(split='TRAIN'); test,ye=load(split='TEST')
                  if train.ndim!=3 or test.ndim!=3:raise ValueError('expected 3D data')
                  if train.shape[1:]!=test.shape[1:]:raise ValueError('different channel/length dimensions')
                  classes=sorted(set(map(str,yt)).union(set(map(str,ye))))
                  mapper={c:i for i,c in enumerate(classes)}
                  yi=np.array([mapper[str(y)] for y in yt]);yj=np.array([mapper[str(y)] for y in ye])
                  train=train.transpose(0,2,1).astype('float32');test=test.transpose(0,2,1).astype('float32')
                  mu=train.mean(axis=(0,1),keepdims=True);sd=np.maximum(train.std(axis=(0,1),keepdims=True),1e-5)
                  train=(train-mu)/sd; test=(test-mu)/sd
                  rng=np.random.default_rng(100*1729+13)
                  idx=np.sort(np.concatenate([rng.choice(np.where(yi==k)[0],5,replace=False) for k in np.unique(yi)]))
                  a=train.reshape(len(train),-1);b=test.reshape(len(test),-1)
                  sc=StandardScaler().fit(a[idx]);p=LogisticRegression(max_iter=2000).fit(sc.transform(a[idx]),yi[idx]).predict(sc.transform(b))
                  score=float(f1_score(yj,p,average='macro'))
                  out=folder/(name+'.npz');np.savez_compressed(out,train_x=train,test_x=test,train_y=yi,test_y=yj)
                  record.update(status='EXECUTED',n_train=len(yi),n_test=len(yj),shape=list(train.shape),macro_f1_raw_5_labels=score,sha256=hashlib.sha256(out.read_bytes()).hexdigest())
              except Exception as exc:
                  record.update(status='BLOCKED',error=type(exc).__name__+': '+str(exc))
              rows.append(record);print(record,flush=True)
          (folder/'dataset_manifest.json').write_text(json.dumps(rows,indent=2))
          if not any(x['status']=='EXECUTED' for x in rows):raise RuntimeError('No real datasets available')
          PY
      - name: Fetch authors source repositories and record commit identifiers
        if: always()
        run: |
          mkdir -p artifacts/sources
          for repo in 'zhihanyue/ts2vec' 'ustc-time-series/TimeMAE'; do
            name="${repo##*/}"
            git clone --depth 1 "https://github.com/$repo.git" "artifacts/sources/$name" \
            && git -C "artifacts/sources/$name" rev-parse HEAD > "artifacts/sources/$name.commit" \
            || echo "BLOCKED $repo" >> artifacts/sources/status.txt
          done
          find artifacts/sources -maxdepth 1 -name '*.commit' -exec sh -c 'cat "$1"' _ '{}' \;
      - name: Upload datasets and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-official-assets-and-raw-baselines
          path: |
            artifacts/data/*
            artifacts/sources/*.commit
            artifacts/sources/status.txt
          if-no-files-found: warn
          retention-days: 30
