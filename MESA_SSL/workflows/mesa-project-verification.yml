name: Verify MESA SSL project folder
on:
  push:
    branches: [mesa-ssl-official-benchmark-2026]
    paths:
      - .github/workflows/mesa-project-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check project files, score counts, imports and runnable sources
        shell: bash
        run: |
          set -euo pipefail
          test -d MESA_SSL
          test ! -e mesa_ssl_benchmark
          test -f MESA_SSL/RESULTS.md
          python - <<'PY'
          from pathlib import Path
          import ast,csv,json
          d=Path("MESA_SSL")
          py=list(d.glob("*.py"))
          for f in py: ast.parse(f.read_text(encoding="utf-8"),filename=str(f))
          scores=list(csv.DictReader((d/"official_results_5seed_50epoch.csv").open(encoding="utf-8")))
          assert len(scores)==75,len(scores)
          audit=json.loads((d/"optimization_results_2026-11-23.json").read_text(encoding="utf-8"))
          assert len(audit["records"])==147
          for f in Path(".github/workflows").glob("mesa-*.yml"):
            mirror=d/"workflows"/f.name
            assert mirror.is_file(), f"Missing mirror: {f.name}"
            assert f.read_bytes()==mirror.read_bytes(),f"Workflow mismatch: {f.name}"
            obsolete = "mesa_" + "ssl_benchmark"
            if f.name != "mesa-project-verification.yml":
              assert obsolete not in f.read_text(encoding="utf-8"),f"Obsolete path: {f.name}"
          print(f"PASS: {len(py)} Python sources, {len(scores)} benchmark rows, {len(audit['records'])} audit records")
          PY
          base64 -d MESA_SSL/bench_neuro_ssl.py.gz.b64 | gzip -dc > /tmp/bench_neuro_ssl.py
          base64 -d MESA_SSL/mesa_mr_experiment.py.gz.b64 | gzip -dc > /tmp/mesa_mr_experiment.py
          echo "d5578abed721e1ab0cafb9c45e13ca7999ef1b2b1d26fe516b96a09e64467860  /tmp/bench_neuro_ssl.py" | sha256sum -c -
          echo "d269f6fc030bf26705c4b0b92f4c0c71516e8aec5a58131db4ba817afddd4884  /tmp/mesa_mr_experiment.py" | sha256sum -c -
          python -m py_compile /tmp/bench_neuro_ssl.py /tmp/mesa_mr_experiment.py
